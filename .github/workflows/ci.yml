name: CI

on:
  push: {}
  pull_request:
    branches: [main]

jobs:
  # ── Python lint ─────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff mypy
      - run: ruff check producer/ consumer/ ml/ inference/ api/ tests/
      - run: mypy producer/ consumer/ ml/ inference/ api/ --ignore-missing-imports

  # ── Python tests ────────────────────────────────────────────────
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: |
          python -m pytest tests/ -v \
            --cov=. \
            --cov-report=xml \
            --cov-report=term-missing \
            -p no:warnings
      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: backend

  # ── Frontend tests ───────────────────────────────────────────────
  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Run Jest
        working-directory: frontend
        run: npm test -- --coverage --ci

  # ── Docker build ─────────────────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build all images
        run: |
          docker compose build --no-cache
