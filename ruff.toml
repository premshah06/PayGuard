[tool.ruff]
target-version = "py311"
line-length = 100
src = ["producer", "consumer", "ml", "inference", "api", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
ignore = ["E501", "B008", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["producer", "consumer", "ml", "inference", "api"]
